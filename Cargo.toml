[package]
name = "voxel-rust"
version = "1.13.0"
edition = "2021"
description = "Jeu de voxels 3D original en Rust : exploration, construction et survie"
license = "MIT"

[dependencies]
macroquad = { version = "=0.4.16", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "=0.8.9"
crc32fast = "=1.5.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
